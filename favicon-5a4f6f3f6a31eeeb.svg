  <!-- The page's icon: a leader, red as the map draws it, and its four
       followers, green, on a ring, the leader's heartbeats to each. -->
  <rect width="64" height="64" rx="12" fill="#1b1b1b"/>
  <g stroke="#a7b0ba" stroke-width="2.6" stroke-linecap="round">
  <line x1="32.0" y1="12.0" x2="52.0" y2="26.5"/>
  <line x1="32.0" y1="12.0" x2="44.3" y2="50.0"/>
  <line x1="32.0" y1="12.0" x2="19.7" y2="50.0"/>
  <line x1="32.0" y1="12.0" x2="12.0" y2="26.5"/>
  </g>
  <g stroke="#1b1b1b" stroke-width="2">
  <circle cx="52.0" cy="26.5" r="6.5" fill="#3fbe90"/>
  <circle cx="44.3" cy="50.0" r="6.5" fill="#3fbe90"/>
  <circle cx="19.7" cy="50.0" r="6.5" fill="#3fbe90"/>
  <circle cx="12.0" cy="26.5" r="6.5" fill="#3fbe90"/>
  <circle cx="32.0" cy="12.0" r="8.5" fill="#d40c1a"/>
  </g>
</svg>
